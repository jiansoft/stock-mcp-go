name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build / vet / fmt / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # setup-go 目前會把 go.mod 的預發行版本 go1.27rc2 誤解析成尚未發布的
      # 穩定版 1.27。使用它支援的 SemVer RC 寫法明確指定同一個 toolchain；
      # Go 1.27 正式發布後可改回 go-version-file: go.mod。
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0-rc.2'
          cache-dependency-path: go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt 檢查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下檔案未經 gofmt 格式化:"
            echo "$unformatted"
            exit 1
          fi

      # 未設定 TEST_DATABASE_URL 時,stock 套件的資料庫整合測試
      # (TestRepositoryIntegration)會自動略過,見 stock/repository_test.go
      # 與 README「已知限制」章節——CI 不連真實資料庫,只跑純邏輯測試。
      - name: go test and coverage
        env:
          MIN_COVERAGE: '85.0'
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "Total statement coverage: ${total}% (minimum: ${MIN_COVERAGE}%)"
          awk -v total="$total" -v minimum="$MIN_COVERAGE" 'BEGIN { exit !(total + 0 >= minimum + 0) }'

      # -race 偵測資料競爭,-shuffle=on 讓測試以隨機順序執行,揭露
      # 「測試之間互相依賴執行順序」這種隱藏問題。兩者都比一般 test
      # 慢,但本專案測試總時長只有數秒,值得每次 CI 都跑。
      - name: go test (race + shuffle)
        run: go test -race -shuffle=on ./...
