name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build / vet / fmt / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt 檢查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下檔案未經 gofmt 格式化:"
            echo "$unformatted"
            exit 1
          fi

      # 全部測試都以假的 Data API(httptest)與記憶體內 MCP 連線執行,不連任何外部服務。
      - name: go test and coverage
        env:
          MIN_COVERAGE: '85.0'
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "Total statement coverage: ${total}% (minimum: ${MIN_COVERAGE}%)"
          awk -v total="$total" -v minimum="$MIN_COVERAGE" 'BEGIN { exit !(total + 0 >= minimum + 0) }'

      # -race 偵測資料競爭,-shuffle=on 讓測試以隨機順序執行,揭露
      # 「測試之間互相依賴執行順序」這種隱藏問題。兩者都比一般 test
      # 慢,但本專案測試總時長只有數秒,值得每次 CI 都跑。
      - name: go test (race + shuffle)
        run: go test -race -shuffle=on ./...
