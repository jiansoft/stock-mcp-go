# docker-compose 範例:僅示範 stock-mcp 服務本身。
#
# 注意:
#   - 不要把 PostgreSQL 公開暴露到網際網路;資料庫應只在內部網路
#     (或既有 stock_rust 主機)供本服務連線。
#   - 秘密一律透過 .env 或部署平台的 secret 管理注入,不寫進 image。
#   - 正式環境請將本服務放在 HTTPS 反向代理(Caddy / Nginx)後方。

services:
  stock-mcp:
    build: .
    restart: unless-stopped
    env_file:
      - .env            # 由 .env.example 複製並填入實際值
    environment:
      HOST: 0.0.0.0     # 容器內必須綁定 0.0.0.0
      PORT: "3000"      # 容器內固定 3000,避免 .env 改動導致 port mapping 失效
    ports:
      # 對外 port 9004 → 容器內 3000;只綁定本機迴環位址,由反向代理對外提供 HTTPS
      - "127.0.0.1:9004:3000"
    # image 本身已內建 HEALTHCHECK(見 Dockerfile),這裡明確再寫一次是為了
    # 讓這份範例可以獨立閱讀,也方便依實際環境調整間隔。它呼叫的是
    # /readyz(就緒檢查,會確認資料來源真的可用),而不是 /healthz(只確認
    # 進程活著)——對「這個實例現在能不能服務請求」而言,前者才是正解。
    healthcheck:
      test: ["CMD", "/stock-mcp", "-health-check"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
